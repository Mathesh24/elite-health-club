[build]
  command = "npm run build"
  # `output: "export"` in next.config.ts emits a static site into ./out
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # Netlify serves this site from the domain root, so no sub-path prefix.
  # (GitHub Pages sets this to /elite-health-club in its own workflow.)
  NEXT_PUBLIC_BASE_PATH = ""
  # These payment settings are stored as Netlify secrets but aren't sensitive,
  # and their values ("true", "sandbox", the public enquiry-form URL, the
  # widget key) legitimately appear in the build output. The OAuth, webhook and
  # sheet secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "PAYMENTS_ENABLED,ZOHO_PAY_ENV,ZOHO_PAY_ACCOUNT_ID,ZOHO_PAY_WIDGET_API_KEY,PAYMENTS_SHEET_WEB_APP_URL"

# Payment backend (Zoho Payments). Shared code lives in netlify/lib.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Shows or hides the "Become a Member" checkout buttons at build time.
# Production stays enquiry-only until go-live; previews get the checkout so it
# can be tested against the Zoho sandbox. Server-side credentials and the
# PAYMENTS_ENABLED switch live in the Netlify UI (functions can't read
# variables set in this file).
[context.production.environment]
  NEXT_PUBLIC_PAYMENTS_ENABLED = "false"

[context.deploy-preview.environment]
  NEXT_PUBLIC_PAYMENTS_ENABLED = "true"

[context.branch-deploy.environment]
  NEXT_PUBLIC_PAYMENTS_ENABLED = "true"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

# Content-hashed build assets never change under the same name.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
